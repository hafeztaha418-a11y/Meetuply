    <main>
     <section class="sign-up">
     <div class="register-box">
        <h2>Create a new account</h2> 
        <form id="signupForm" action="./index.html">
        <div class="input-group-reg">
            <label for="name">Yor Name</label>
            <input type="text" id="name" placeholder="Enter Your Name">
        </div>
        <div class="input-group-reg">
            <label for="email">Email</label>
            <input type="email" id="email" placeholder="example@gmail.com">
        </div>
            <div class="input-group-reg">
            <label for="password">Phone</label>
            <input type="tel" id="password" placeholder="Your Phone">
        </div>
           <div class="input-group-reg">
            <label for="age">Yor Age</label>
            <input type="number" id="age" placeholder="Your Age">
        </div>

        <div class="input-group-reg">
            <label for="password">Password</label>
            <input type="password" id="password" placeholder="••••••••">
        </div>

        <div class="input-group-reg">
            <label for="confirm">Confirm Password</label>
            <input type="password" id="confirm" placeholder="••••••••">
        </div>
        <button type="submit" class="btn-signup">Register</button>
        <p id="errorMsg" class="error"></p>
        </form>
        <p class="login-link">Do you already have an account?  <a href="./resgiser.html">Register</a></p>
    </div>
